name: Tab bar hit testing

on:
  workflow_dispatch:
  push:
    branches: [fix/mini-player-hit-testing]

permissions:
  contents: read

jobs:
  regression:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Build harness
        run: sh harness/tabbar/build.sh
      - name: Check hit routing
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" harness/tabbar/build/TabBarHarness.app
          xcrun simctl launch --console "$DEVICE" com.vojta.tabbarharness ghost > /tmp/tabbar.log 2>&1 &
          LAUNCH_PID=$!
          for attempt in $(seq 1 45); do
            if grep -q 'ghost touch regression PASS' /tmp/tabbar.log; then
              cat /tmp/tabbar.log
              xcrun simctl terminate "$DEVICE" com.vojta.tabbarharness
              exit 0
            fi
            if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/tabbar.log
          exit 1
